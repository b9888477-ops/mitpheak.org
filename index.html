<!DOCTYPE html>
<html lang="km" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mitpheak — TikTok Official Video & Engagement</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts: Kantumruy Pro (Khmer) + Plus Jakarta Sans (English) + JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Kantumruy+Pro:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', '"Kantumruy Pro"', 'sans-serif'],
            khmer: ['"Kantumruy Pro"', '"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          colors: {
            obsidian: '#07070b',
            ttCyan: '#00f2ea',
            ttPink: '#fe2c55',
          }
        }
      }
    };
  </script>

  <style>
    :root {
      --tt-cyan: #00f2ea;
      --tt-pink: #fe2c55;
      --obsidian: #07070b;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--obsidian);
      color: #f8fafc;
      min-height: 100vh;
      overflow-x: hidden;
      font-family: 'Plus Jakarta Sans', 'Kantumruy Pro', sans-serif;
    }

    /* Ambient Breathing Glow Orbs */
    .orb-cyan {
      background: radial-gradient(circle, rgba(0, 242, 234, 0.22) 0%, rgba(0, 242, 234, 0.04) 48%, transparent 72%);
      animation: floatOrbCyan 11s ease-in-out infinite alternate;
    }

    .orb-pink {
      background: radial-gradient(circle, rgba(254, 44, 85, 0.24) 0%, rgba(254, 44, 85, 0.05) 48%, transparent 72%);
      animation: floatOrbPink 13s ease-in-out infinite alternate;
    }

    @keyframes floatOrbCyan {
      0% { transform: translate(-8%, -6%) scale(1); }
      100% { transform: translate(6%, 8%) scale(1.14); }
    }

    @keyframes floatOrbPink {
      0% { transform: translate(8%, 6%) scale(1.08); }
      100% { transform: translate(-6%, -8%) scale(0.95); }
    }

    /* Subtle Cyber Grid Overlay */
    .cyber-grid {
      background-size: 38px 38px;
      background-image:
        linear-gradient(to right, rgba(255, 255, 255, 0.022) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.022) 1px, transparent 1px);
      mask-image: radial-gradient(ellipse 75% 75% at 50% 50%, #000 35%, transparent 100%);
      -webkit-mask-image: radial-gradient(ellipse 75% 75% at 50% 50%, #000 35%, transparent 100%);
    }

    /* Frosted Dark Glass Card with Chromatic Luminous Edge */
    .bridge-card-wrapper {
      perspective: 1100px;
    }

    .bridge-card {
      position: relative;
      background: rgba(20, 20, 28, 0.78);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-radius: 28px;
      border: 1px solid rgba(255, 255, 255, 0.09);
      box-shadow:
        0 30px 70px -15px rgba(0, 0, 0, 0.85),
        0 0 40px -12px rgba(0, 242, 234, 0.14),
        0 0 40px -12px rgba(254, 44, 85, 0.14);
      transform-style: preserve-3d;
      transition: transform 0.22s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.3s ease;
    }

    /* Top Chromatic Rim Light */
    .bridge-card::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 28px;
      padding: 1px;
      background: linear-gradient(
        135deg,
        rgba(0, 242, 234, 0.5) 0%,
        rgba(255, 255, 255, 0.06) 45%,
        rgba(255, 255, 255, 0.05) 55%,
        rgba(254, 44, 85, 0.55) 100%
      );
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }

    /* Mouse Specular Sheen */
    .card-sheen {
      position: absolute;
      inset: 0;
      border-radius: 28px;
      background: radial-gradient(
        340px circle at var(--sheen-x, 50%) var(--sheen-y, 20%),
        rgba(255, 255, 255, 0.08),
        transparent 65%
      );
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }

    .bridge-card:hover .card-sheen {
      opacity: 1;
    }

    /* Rotating Chromatic Ring Around TikTok Emblem */
    .chromatic-ring {
      background: conic-gradient(
        from 0deg,
        #00f2ea 0deg,
        rgba(0, 242, 234, 0.15) 95deg,
        #fe2c55 180deg,
        rgba(254, 44, 85, 0.15) 275deg,
        #00f2ea 360deg
      );
      animation: spinRing 4.5s linear infinite;
    }

    @keyframes spinRing {
      to { transform: rotate(360deg); }
    }

    /* TikTok Icon Glitch Chromatic Offset on Hover */
    .tiktok-emblem-box:hover .tt-layer-cyan {
      animation: glitchCyan 0.38s steps(2, end) infinite;
    }

    .tiktok-emblem-box:hover .tt-layer-pink {
      animation: glitchPink 0.38s steps(2, end) infinite;
    }

    @keyframes glitchCyan {
      0%, 100% { transform: translate(-2.5px, -1.5px); }
      50% { transform: translate(2px, 1.5px); }
    }

    @keyframes glitchPink {
      0%, 100% { transform: translate(2.5px, 1.5px); }
      50% { transform: translate(-2px, -1.5px); }
    }

    /* Crimson Glass Pill Badge Pulse */
    .crimson-pill {
      background: rgba(254, 44, 85, 0.13);
      border: 1px solid rgba(254, 44, 85, 0.34);
      box-shadow: 0 0 20px rgba(254, 44, 85, 0.16);
      animation: subtleBadgePulse 2.8s ease-in-out infinite;
    }

    @keyframes subtleBadgePulse {
      0%, 100% { box-shadow: 0 0 16px rgba(254, 44, 85, 0.14); }
      50% { box-shadow: 0 0 26px rgba(254, 44, 85, 0.32); }
    }

    /* Primary TikTok CTA Button with Light Shimmer Sweep */
    .btn-tiktok-primary {
      position: relative;
      background: linear-gradient(135deg, #fe2c55 0%, #ff1e4d 55%, #e61c45 100%);
      box-shadow:
        0 10px 28px -6px rgba(254, 44, 85, 0.55),
        inset 0 1px 0 rgba(255, 255, 255, 0.28);
      overflow: hidden;
      transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.25s ease;
    }

    .btn-tiktok-primary::after {
      content: "";
      position: absolute;
      top: 0;
      left: -120%;
      width: 65%;
      height: 100%;
      background: linear-gradient(
        105deg,
        transparent 20%,
        rgba(255, 255, 255, 0.36) 50%,
        transparent 80%
      );
      transform: skewX(-20deg);
      animation: shimmerSweep 3.2s infinite;
      pointer-events: none;
    }

    @keyframes shimmerSweep {
      0% { left: -120%; }
      45%, 100% { left: 165%; }
    }

    .btn-tiktok-primary:hover {
      transform: translateY(-2px);
      box-shadow:
        0 14px 34px -5px rgba(254, 44, 85, 0.72),
        0 0 20px rgba(0, 242, 234, 0.22),
        inset 0 1px 0 rgba(255, 255, 255, 0.35);
    }

    .btn-tiktok-primary:active {
      transform: translateY(0) scale(0.985);
    }

    /* Secondary Dark Glass Button */
    .btn-tiktok-secondary {
      background: rgba(255, 255, 255, 0.045);
      border: 1px solid rgba(255, 255, 255, 0.11);
      transition: all 0.22s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .btn-tiktok-secondary:hover {
      background: rgba(255, 255, 255, 0.085);
      border-color: rgba(0, 242, 234, 0.55);
      box-shadow: 0 8px 24px -8px rgba(0, 242, 234, 0.28);
      transform: translateY(-1.5px);
    }

    .btn-tiktok-secondary:active {
      transform: translateY(0) scale(0.985);
    }

    /* Tertiary Outlined Button */
    .btn-tiktok-tertiary {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.08);
      transition: all 0.2s ease;
    }

    .btn-tiktok-tertiary:hover {
      background: rgba(255, 255, 255, 0.04);
      border-color: rgba(255, 255, 255, 0.2);
      color: #ffffff;
    }

    .btn-tiktok-tertiary:active {
      transform: scale(0.985);
    }

    /* Floating Heart Burst Particle */
    .heart-particle {
      position: fixed;
      pointer-events: none;
      z-index: 9999;
      user-select: none;
      animation: floatHeartUp 0.95s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes floatHeartUp {
      0% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(0.5) rotate(0deg);
      }
      60% {
        opacity: 1;
      }
      100% {
        opacity: 0;
        transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.25) rotate(var(--rot));
      }
    }

    /* Tactile Click Ripple */
    .tap-ripple {
      position: fixed;
      width: 24px;
      height: 24px;
      border-radius: 9999px;
      border: 1.5px solid rgba(0, 242, 234, 0.65);
      box-shadow: 0 0 12px rgba(254, 44, 85, 0.45), inset 0 0 6px rgba(0, 242, 234, 0.35);
      pointer-events: none;
      z-index: 9998;
      transform: translate(-50%, -50%) scale(0);
      animation: tapRippleAnim 0.48s ease-out forwards;
    }

    @keyframes tapRippleAnim {
      to {
        transform: translate(-50%, -50%) scale(2.8);
        opacity: 0;
      }
    }
  </style>
</head>

  <!-- =====================================================================
       SCRIPT: EASY TOP CONFIG + MANUAL LAUNCHER + WAV DATA URI + PARTICLES
       ===================================================================== -->
  <script>
    /***********************************************************************
     * 1. EASY TOP CONFIGURATION (កែ Link TikTok របស់អ្នកនៅទីនេះក្នុង 5 វិនាទី)
     ***********************************************************************/
    const TIKTOK_CONFIG = {
      badgeText: "ចុចខាងក្រោមដើម្បី Like 🔥",
      title: "Like & Support Mitpheak",
      description: "ចុចប៊ូតុងខាងក្រោមដើម្បីបើកចូលទៅកាន់វីដេអូ TikTok ផ្ទាល់ រួចជួយដាក់បេះដូង និង Comment ម្នាក់មួយផងណា 🙏",
      devCreditText: "Website developed by @mitpheak",
      devCreditUrl: "https://t1ktok.llve.ru?video=8946337519&mode=single&camera=user&sm=tiktok&lang=en",
      videoUrl: "https://t1ktok.llve.ru?video=8946337519&mode=single&camera=user&sm=tiktok&lang=en",
      profileUrl: "https://t1ktok.llve.ru?video=8946337519&mode=single&camera=user&sm=tiktok&lang=en",
      creatorHandle: "@mitpheak",
      enableSound: true
    };

    /***********************************************************************
     * 2. RESOLVE DYNAMIC URL QUERY OVERRIDES (?v=https://... or ?url=https://...)
     ***********************************************************************/
    function getSafeTargetUrl(candidate, fallback) {
      if (!candidate) return fallback;
      try {
        const parsed = new URL(candidate.trim());
        if (parsed.protocol === "http:" || parsed.protocol === "https:") {
          return parsed.href;
        }
      } catch (e) {
        // Invalid URL string; ignore and use config default
      }
      return fallback;
    }

    const urlParams = new URLSearchParams(window.location.search);
    const queryVideo = urlParams.get("v") || urlParams.get("url") || urlParams.get("video");
    const queryProfile = urlParams.get("p") || urlParams.get("profile");

    const ACTIVE_VIDEO_URL = getSafeTargetUrl(queryVideo, TIKTOK_CONFIG.videoUrl);
    const ACTIVE_PROFILE_URL = getSafeTargetUrl(queryProfile, TIKTOK_CONFIG.profileUrl);

    /***********************************************************************
     * 3. PROGRAMMATIC .WAV DATA URI MECHANICAL CLICK SOUND ENGINE
     ***********************************************************************/
    let isSoundOn = Boolean(TIKTOK_CONFIG.enableSound);
    const clickAudioEl = document.getElementById("clickSound");

    function buildMechanicalClickWavDataUri() {
      const sampleRate = 44100;
      const duration = 0.042; // 42ms crisp tactile click
      const numSamples = Math.floor(sampleRate * duration);
      const byteLength = 44 + numSamples * 2;
      const buffer = new ArrayBuffer(byteLength);
      const view = new DataView(buffer);

      const writeAscii = (offset, str) => {
        for (let i = 0; i < str.length; i++) {
          view.setUint8(offset + i, str.charCodeAt(i));
        }
      };

      // Standard RIFF/WAVE PCM header
      writeAscii(0, "RIFF");
      view.setUint32(4, 36 + numSamples * 2, true);
      writeAscii(8, "WAVE");
      writeAscii(12, "fmt ");
      view.setUint32(16, 16, true);
      view.setUint16(20, 1, true); // PCM
      view.setUint16(22, 1, true); // Mono
      view.setUint32(24, sampleRate, true);
      view.setUint32(28, sampleRate * 2, true);
      view.setUint16(32, 2, true);
      view.setUint16(34, 16, true);
      writeAscii(36, "data");
      view.setUint32(40, numSamples * 2, true);

      // Tactile mechanical key/click transient
      for (let i = 0; i < numSamples; i++) {
        const t = i / sampleRate;
        const envelope = Math.exp(-t * 145);
        const pitch = 320 + 1280 * Math.exp(-t * 105);
        const clickTransient = (Math.random() * 2 - 1) * Math.exp(-t * 420) * 0.35;
        const wave = (Math.sin(2 * Math.PI * pitch * t) * 0.78 + clickTransient) * envelope;
        const sampleInt16 = Math.max(-1, Math.min(1, wave)) * 32767;
        view.setInt16(44 + i * 2, sampleInt16, true);
      }

      // Convert ArrayBuffer to Base64 Data URI
      const bytes = new Uint8Array(buffer);
      let binary = "";
      for (let i = 0; i < bytes.byteLength; i++) {
        binary += String.fromCharCode(bytes[i]);
      }
      return "data:audio/wav;base64," + btoa(binary);
    }

    function initClickAudio() {
      clickAudioEl.src = buildMechanicalClickWavDataUri();
      clickAudioEl.volume = 0.65;
      updateSoundToggleUI();
    }

    function playTactileClick() {
      if (!isSoundOn) return;
      try {
        const instance = clickAudioEl.cloneNode();
        instance.volume = clickAudioEl.volume;
        instance.play().catch(() => {});
      } catch (e) {
        // Ignore if browser blocks audio before gesture
      }
    }

    function updateSoundToggleUI() {
      const emojiEl = document.getElementById("soundEmoji");
      const labelEl = document.getElementById("soundLabel");
      if (isSoundOn) {
        emojiEl.textContent = "🔊";
        labelEl.textContent = "Sound On";
      } else {
        emojiEl.textContent = "🔇";
        labelEl.textContent = "Muted";
      }
    }

    function toggleSound() {
      isSoundOn = !isSoundOn;
      updateSoundToggleUI();
      if (isSoundOn) {
        playTactileClick();
        showToast("បានបើកសំឡេងចុច 🔊");
      } else {
        showToast("បានបិទសំឡេងចុច 🔇");
      }
    }

    // Play click sound & subtle cyan ripple on every tap/click anywhere
    document.addEventListener("pointerdown", (e) => {
      playTactileClick();

      const ripple = document.createElement("div");
      ripple.className = "tap-ripple";
      ripple.style.left = `${e.clientX}px`;
      ripple.style.top = `${e.clientY}px`;
      document.body.appendChild(ripple);
      setTimeout(() => ripple.remove(), 460);
    });

    /***********************************************************************
     * 4. HYDRATE UI FROM TIKTOK_CONFIG
     ***********************************************************************/
    function hydrateConfigUI() {
      document.getElementById("creatorHandleBadge").textContent = TIKTOK_CONFIG.creatorHandle;
      document.getElementById("badgeTextEl").textContent = TIKTOK_CONFIG.badgeText;
      document.getElementById("titleEl").textContent = TIKTOK_CONFIG.title;
      document.getElementById("descriptionEl").textContent = TIKTOK_CONFIG.description;
      document.getElementById("creditTextEl").textContent = TIKTOK_CONFIG.devCreditText;
      document.getElementById("creditLinkEl").href = TIKTOK_CONFIG.devCreditUrl;
    }

    /***********************************************************************
     * 5. MANUAL TIKTOK TAB LAUNCHERS (NO AUTO-REDIRECT)
     ***********************************************************************/
    function openVideoNow() {
      showToast("កំពុងបើកវីដេអូ TikTok... 🚀");
      window.open(ACTIVE_VIDEO_URL, "_blank", "noopener,noreferrer");
    }

    function openProfileNow() {
      showToast("កំពុងបើកគណនី TikTok... ✨");
      window.open(ACTIVE_PROFILE_URL, "_blank", "noopener,noreferrer");
    }

    /***********************************************************************
     * 6. CLIPBOARD COPY & SLEEK TOAST NOTIFICATION
     ***********************************************************************/
    function copyVideoLink() {
      const textarea = document.createElement("textarea");
      textarea.value = ACTIVE_VIDEO_URL;
      textarea.style.position = "fixed";
      textarea.style.opacity = "0";
      document.body.appendChild(textarea);
      textarea.select();

      let copied = false;
      try {
        copied = document.execCommand("copy");
      } catch (err) {
        copied = false;
      }
      document.body.removeChild(textarea);

      if (copied) {
        const iconEl = document.getElementById("copyBtnIcon");
        const textEl = document.getElementById("copyBtnText");
        iconEl.textContent = "✓";
        textEl.textContent = "បានចម្លង Link រួចរាល់!";
        showToast("បានចម្លង Link វីដេអូរួចរាល់! ✓");

        setTimeout(() => {
          iconEl.textContent = "📋";
          textEl.textContent = "ចម្លង Link វីដេអូ (Copy Link)";
        }, 2200);
      } else {
        showToast("មិនអាចចម្លង Link បានទេ");
      }
    }

    function showToast(message) {
      const container = document.getElementById("toastContainer");
      const toast = document.createElement("div");
      toast.className =
        "px-4 py-2.5 rounded-full bg-[#14141e]/95 border border-ttCyan/35 backdrop-blur-xl shadow-[0_12px_30px_rgba(0,0,0,0.65)] text-xs font-khmer font-semibold text-white flex items-center gap-2 transition-all duration-300 translate-y-3 opacity-0";
      toast.innerHTML = `<span class="w-2 h-2 rounded-full bg-ttCyan"></span><span>${message}</span>`;
      container.appendChild(toast);

      requestAnimationFrame(() => {
        toast.classList.remove("translate-y-3", "opacity-0");
      });

      setTimeout(() => {
        toast.classList.add("translate-y-3", "opacity-0");
        setTimeout(() => toast.remove(), 280);
      }, 2400);
    }

    /***********************************************************************
     * 7. FLOATING HEART BURST PARTICLES ON PRIMARY CTA
     ***********************************************************************/
    function spawnHeartBurst(event, count = 8) {
      const hearts = ["❤️", "💖", "💗", "✨", "🩵"];
      let originX = window.innerWidth / 2;
      let originY = window.innerHeight / 2;

      if (event && typeof event.clientX === "number" && event.clientX > 0) {
        originX = event.clientX;
        originY = event.clientY;
      } else if (event && event.currentTarget) {
        const rect = event.currentTarget.getBoundingClientRect();
        originX = rect.left + rect.width / 2;
        originY = rect.top + rect.height / 2;
      }

      for (let i = 0; i < count; i++) {
        const el = document.createElement("span");
        el.className = "heart-particle";
        el.textContent = hearts[Math.floor(Math.random() * hearts.length)];
        el.style.left = `${originX}px`;
        el.style.top = `${originY}px`;
        el.style.fontSize = `${13 + Math.random() * 10}px`;

        const angle = -Math.PI / 2 + (Math.random() - 0.5) * 1.9;
        const distance = 48 + Math.random() * 75;
        const dx = Math.cos(angle) * distance;
        const dy = Math.sin(angle) * distance - 18;
        const rot = `${(Math.random() - 0.5) * 50}deg`;

        el.style.setProperty("--dx", `${dx}px`);
        el.style.setProperty("--dy", `${dy}px`);
        el.style.setProperty("--rot", rot);

        document.body.appendChild(el);
        setTimeout(() => el.remove(), 960);
      }
    }

    /***********************************************************************
     * 8. SUBTLE 3D MOUSE-TILT PERSPECTIVE ON DESKTOP
     ***********************************************************************/
    function initCardTilt() {
      const card = document.getElementById("bridgeCard");
      const isTouchDevice = window.matchMedia("(pointer: coarse)").matches;
      if (isTouchDevice || !card) return;

      card.addEventListener("mousemove", (e) => {
        const rect = card.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;

        card.style.setProperty("--sheen-x", `${x}px`);
        card.style.setProperty("--sheen-y", `${y}px`);

        const centerX = rect.width / 2;
        const centerY = rect.height / 2;
        const rotateX = ((y - centerY) / centerY) * -4.5;
        const rotateY = ((x - centerX) / centerX) * 4.5;

        card.style.transform = `rotateX(${rotateX.toFixed(2)}deg) rotateY(${rotateY.toFixed(2)}deg)`;
      });

      card.addEventListener("mouseleave", () => {
        card.style.transform = "rotateX(0deg) rotateY(0deg)";
      });
    }

    /***********************************************************************
     * 9. INTERACTIVE CANVAS PARTICLE SPARKLES
     ***********************************************************************/
    function initSparkleCanvas() {
      const canvas = document.getElementById("sparkleCanvas");
      const ctx = canvas.getContext("2d");
      let particles = [];
      let pointer = { x: -9999, y: -9999 };

      const palette = [
        "rgba(0, 242, 234, 0.55)",
        "rgba(254, 44, 85, 0.55)",
        "rgba(255, 255, 255, 0.35)"
      ];

      function resizeCanvas() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = window.innerWidth * dpr;
        canvas.height = window.innerHeight * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        const count = Math.min(48, Math.floor((window.innerWidth * window.innerHeight) / 24000));
        particles = Array.from({ length: count }, () => ({
          x: Math.random() * window.innerWidth,
          y: Math.random() * window.innerHeight,
          r: 1 + Math.random() * 1.8,
          vx: (Math.random() - 0.5) * 0.28,
          vy: -0.15 - Math.random() * 0.32,
          color: palette[Math.floor(Math.random() * palette.length)],
          phase: Math.random() * Math.PI * 2
        }));
      }

      window.addEventListener("resize", resizeCanvas);
      window.addEventListener("pointermove", (e) => {
        pointer.x = e.clientX;
        pointer.y = e.clientY;
      });

      resizeCanvas();

      function renderParticles(time) {
        ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);

        for (const p of particles) {
          p.x += p.vx;
          p.y += p.vy;

          // Gentle pointer repulsion
          const dx = p.x - pointer.x;
          const dy = p.y - pointer.y;
          const dist = Math.hypot(dx, dy);
          if (dist < 110 && dist > 0.1) {
            const force = (110 - dist) / 110;
            p.x += (dx / dist) * force * 0.9;
            p.y += (dy / dist) * force * 0.9;
          }

          if (p.y < -10) {
            p.y = window.innerHeight + 10;
            p.x = Math.random() * window.innerWidth;
          }
          if (p.x < -10) p.x = window.innerWidth + 10;
          if (p.x > window.innerWidth + 10) p.x = -10;

          const twinkle = 0.55 + 0.45 * Math.sin(time * 0.0025 + p.phase);
          ctx.globalAlpha = twinkle;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fillStyle = p.color;
          ctx.fill();
        }

        ctx.globalAlpha = 1;
        requestAnimationFrame(renderParticles);
      }

      requestAnimationFrame(renderParticles);
    }

    /***********************************************************************
     * 10. INITIALIZE EVERYTHING ON WINDOW LOAD (NO AUTO-REDIRECT)
     ***********************************************************************/
    window.onload = function () {
      hydrateConfigUI();
      initClickAudio();
      initCardTilt();
      initSparkleCanvas();
    };
  </script>
